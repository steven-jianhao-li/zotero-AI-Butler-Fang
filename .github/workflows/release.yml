name: Release

run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "Fang_v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build
        run: |
          npm run build

      - name: Verify release assets
        run: |
          test "$(find .scaffold/build -maxdepth 1 -name '*.xpi' | wc -l)" -eq 1
          test -f ".scaffold/build/update.json"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            .scaffold/build/*.xpi
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Refresh update manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Release Manifest
          body: |
            This release is used to host `update.json`, please do not delete or modify it.

            Updated for ${{ github.ref_name }}.
          prerelease: true
          make_latest: false
          files: |
            .scaffold/build/update.json
            .scaffold/build/update-beta.json
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._